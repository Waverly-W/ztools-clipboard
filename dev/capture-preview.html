<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>截图</title>
  <link rel="stylesheet" href="../src/capture.css" />
</head>
<body>
  <!-- 定格全屏选区：定格画面、选区外变暗、选区框、放大镜 -->
  <canvas id="frozen" class="hidden"></canvas>
  <div id="dim" class="hidden">
    <div class="dim" id="dim-t"></div>
    <div class="dim" id="dim-b"></div>
    <div class="dim" id="dim-l"></div>
    <div class="dim" id="dim-r"></div>
    <div id="selbox"><span id="sel-info"></span></div>
  </div>
  <div id="magnifier" class="hidden"><canvas id="mag-canvas" width="120" height="120"></canvas><div id="mag-info"></div></div>
  <div id="select-hint" class="hidden">拖动选择截图区域 · 右键或 Esc 取消</div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <canvas id="overlay"></canvas>
    <textarea id="text-input" class="hidden" spellcheck="false"></textarea>
  </div>
  <div id="toolbar" class="hidden">
    <div class="bar" id="bar-main"></div>
    <div class="bar" id="bar-options"></div>
  </div>
  <div id="menu" class="hidden"></div>
  <div id="tip" class="hidden"></div>

  <script src="capture-mock.js"></script>
  <script src="../src/icons.js"></script>
  <script src="../src/capture.js"></script>
  <script src="scenes.js"></script>
</body>
</html>
